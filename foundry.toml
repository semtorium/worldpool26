[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
abstract_testnet  = "https://api.testnet.abs.xyz"
abstract_mainnet  = "https://api.mainnet.abs.xyz"
base_sepolia      = "https://sepolia.base.org"
base_mainnet      = "https://mainnet.base.org"

[etherscan]
abstract_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.testnet.abs.xyz/api" }
abstract_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://explorer.abs.xyz/api" }
base_sepolia     = { key = "${BASESCAN_API_KEY}",  url = "https://api-sepolia.basescan.org/api" }
base_mainnet     = { key = "${BASESCAN_API_KEY}",  url = "https://api.basescan.org/api" }
